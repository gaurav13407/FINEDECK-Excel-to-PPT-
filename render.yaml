services:
  # FastAPI Backend
  - type: web
    name: findeck-backend
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install --upgrade pip && pip install -r requirements-render.txt
    startCommand: python src/backend/run_server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ENVIRONMENT
        value: production
      # MongoDB
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_NAME
        value: findeck_db
      # JWT - 7 days token expiration
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRATION_MINUTES
        value: "10080"
      # Redis/Upstash (Optional - for session management)
      - key: ENABLE_REDIS_SESSIONS
        value: "true"
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: SESSION_SECRET_KEY
        sync: false
      # CORS
      - key: CORS_ORIGINS
        value: '["https://www.findeck.live","https://findeck.live"]'
      # Storage
      - key: USE_B2_STORAGE
        value: "true"
      - key: B2_APPLICATION_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_BUCKET_NAME
        value: FinDeck-Storage
      - key: B2_ENDPOINT
        value: s3.us-east-005.backblazeb2.com
      # AI
      - key: GROQ_API_KEY
        sync: false
      # Email
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: no-reply@findeck.live
      # OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Frontend
      - key: FRONTEND_URL
        value: https://www.findeck.live
      # File limits
      - key: MAX_FILE_SIZE_MB
        value: "50"

