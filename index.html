<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinDeck - Excel to PowerPoint Converter</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #000004 0%, #191919 100%);
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .loading-container {
            max-width: 600px;
            padding: 40px;
        }
        .logo {
            font-size: 3rem;
            font-weight: bold;
            color: #e59d02;
            margin-bottom: 20px;
        }
        .loading-text {
            font-size: 1.2rem;
            margin-bottom: 30px;
            opacity: 0.8;
        }
        .spinner {
            border: 3px solid rgba(229, 157, 2, 0.3);
            border-radius: 50%;
            border-top: 3px solid #e59d02;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="logo">FinDeck</div>
        <div class="loading-text">Redirecting to Excel to PowerPoint Converter...</div>
        <div class="spinner"></div>
    </div>

    <script>
        // Redirect to the main application
        setTimeout(() => {
            window.location.href = './src/ui/index.html';
        }, 2000);
    </script>
</body>
</html>
