<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinDeck Login Form</title>
    <!-- Favicon -->
    <link href="assets/img/favicon.png" rel="icon">
    <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">
    
    <!-- Google Fonts - Match Landing Page -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Raleway:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="neu-icon">
                    <div class="icon-inner">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </div>
                </div>
                <h2>Welcome back</h2>
                <p>Please sign in to continue</p>
            </div>
            
            <form class="login-form" id="loginForm" action="mainpage.html" method="get" novalidate>
                <div class="form-group">
                    <div class="input-group neu-input">
                        <input type="email" id="email" name="email" required autocomplete="email" placeholder=" ">
                        <label for="email">Email address</label>
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                <polyline points="22,6 12,13 2,6"/>
                            </svg>
                        </div>
                    </div>
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <div class="input-group neu-input password-group">
                        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder=" ">
                        <label for="password">Password</label>
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0110 0v4"/>
                            </svg>
                        </div>
                        <button type="button" class="password-toggle neu-toggle" id="passwordToggle" aria-label="Toggle password visibility">
                            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div class="form-options">
                    <div class="remember-wrapper">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember" class="checkbox-label">
                            <div class="neu-checkbox">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                    <polyline points="20 6 9 17 4 12"/>
                                </svg>
                            </div>
                            Remember me
                        </label>
                    </div>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="neu-button login-btn">
                    <span class="btn-text">Sign In</span>
                    <div class="btn-loader">
                        <div class="neu-spinner"></div>
                    </div>
                </button>
            </form>

            <div class="divider">
                <div class="divider-line"></div>
                <span>or continue with</span>
                <div class="divider-line"></div>
            </div>

            <div class="social-login">
                <button type="button" class="social-btn neu-social">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                </button>
                <button type="button" class="social-btn neu-social">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                    </svg>
                </button>
                <button type="button" class="social-btn neu-social">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/>
                    </svg>
                </button>
            </div>

            <div class="signup-link">
                <p>Don't have an account? <a href="signup.html">Sign up</a></p>
            </div>

            <div class="legal-links">
                <a href="#" id="termsLink">Terms of Service</a> |
                <a href="#" id="privacyLink">Privacy Policy</a>
            </div>

            <div class="success-message" id="successMessage">
                <div class="success-icon neu-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                </div>
                <h3>Success!</h3>
                <p>Redirecting to Excel Converter...</p>
            </div>
        </div>

    <!-- Modal for Terms/Privacy -->
    <div id="legalModal" class="legal-modal">
        <div class="legal-modal-content">
            <button class="legal-modal-close" id="legalModalClose" aria-label="Close">&times;</button>
            <div id="legalModalBody">
                <!-- Content will be injected here -->
            </div>
        </div>
    </div>
    </div>

    <!-- API Configuration and Service -->
    <script src="assets/js/api-config.js"></script>
    <script src="assets/js/api-service.js"></script>
    <!-- Authentication JS -->
    <script src="assets/js/auth.js"></script>
    <!-- Login Form JS -->
    <script src="assets/js/login.js"></script>
    <script>
    // Modal logic for Terms/Privacy
    const termsLink = document.getElementById('termsLink');
    const privacyLink = document.getElementById('privacyLink');
    const legalModal = document.getElementById('legalModal');
    const legalModalClose = document.getElementById('legalModalClose');
    const legalModalBody = document.getElementById('legalModalBody');

    const termsContent = `
        <h2>Terms of Service — FinDeck</h2>
        <p>Welcome to FinDeck, a web-based application that converts Excel files into PowerPoint presentations. By using our service, you agree to these Terms of Service. Please read them carefully before using FinDeck.</p>

        <h3>1. Acceptance of Terms</h3>
        <p>By accessing or using FinDeck (“the Service”), you agree to be bound by these Terms. If you do not agree, you may not use the Service.</p>

        <h3>2. Use of the Service</h3>
        <p>FinDeck allows you to upload Excel files for the purpose of converting them into PowerPoint presentations. You agree not to use the Service for illegal, abusive, or unauthorized purposes. You retain full ownership of your uploaded and converted files. FinDeck only processes them temporarily to complete the conversion.</p>

        <h3>3. File Storage and Deletion</h3>
        <p>Uploaded and converted files are stored temporarily in our secure database. All files (including backups, metadata, and conversion results) are automatically deleted after 24 hours of upload. Once deleted, your data cannot be recovered. FinDeck does not use uploaded files for training, analytics, or third-party sharing.</p>

        <h3>4. Intellectual Property</h3>
        <p>All rights to FinDeck’s brand name, logo, design, and source code belong to [Your Name or Company Name]. You may not copy, modify, or redistribute any part of the Service without written permission.</p>

        <h3>5. Availability</h3>
        <p>We aim to keep the Service available 24/7 but cannot guarantee uninterrupted access. We reserve the right to pause operations for maintenance or technical improvements.</p>

        <h3>6. Disclaimer of Warranties</h3>
        <p>The Service is provided “as is” without any express or implied warranties. We do not guarantee the accuracy, completeness, or format consistency of the converted presentations.</p>

        <h3>7. Limitation of Liability</h3>
        <p>FinDeck and its developers are not responsible for any loss of data, profit, or business interruptions caused by using or being unable to use the Service.</p>

        <h3>8. Changes to Terms</h3>
        <p>We may modify these Terms periodically. Updates will be reflected by the “Last Updated” date shown on this page.</p>

        <h3>9. Contact</h3>
        <p>For any concerns or inquiries, contact us at: <a href="mailto:gaurav13407@outlook.com">gaurav13407@outlook.com</a></p>
    `;
    const privacyContent = `
        <h2>Privacy Policy — FinDeck</h2>
        <p>FinDeck respects your privacy and is committed to protecting your personal data and uploaded files. This Privacy Policy explains how we handle, store, and delete user data.</p>

        <h3>1. Information We Collect</h3>
        <p>We collect the following data:</p>
        <ul>
            <li>Uploaded Excel files (temporarily stored for conversion)</li>
            <li>Basic system data such as browser type, operating system, and IP address (for analytics and debugging)</li>
        </ul>

        <h3>2. How We Use Your Data</h3>
        <p>To convert Excel files into PowerPoint presentations and to ensure service reliability and improve functionality. We do not share, sell, or use your data for advertising or profiling.</p>

        <h3>3. File Storage and Automatic Deletion</h3>
        <p>Uploaded and generated files are automatically deleted from our database within 24 hours after upload. We do not retain any backups or copies of your files after deletion. Once deleted, files are permanently removed and cannot be recovered.</p>

        <h3>4. Security</h3>
        <p>We use encryption and secure connections (HTTPS) to protect file transfers. However, no digital service is entirely risk-free — use FinDeck at your own discretion.</p>

        <h3>5. Cookies</h3>
        <p>FinDeck may use cookies to improve user experience. You can disable them through your browser settings.</p>

        <h3>6. Third-Party Services</h3>
        <p>If we integrate third-party APIs (e.g., file storage or analytics), those services have their own privacy policies. FinDeck does not control how they handle data.</p>

        <h3>7. User Rights</h3>
        <p>You can contact us anytime to request deletion of any data related to your session or ask questions about how your information is handled.</p>

        <h3>8. Policy Updates</h3>
        <p>We may update this Privacy Policy occasionally. Updates will be reflected by the “Last Updated” date.</p>

        <h3>9. Contact</h3>
        <p>For any concerns or inquiries, contact us at: <a href="mailto:gaurav13407@outlook.com">gaurav13407@outlook.com</a></p>
    `;

    function openModal(content) {
        legalModalBody.innerHTML = content;
        legalModal.style.display = 'block';
    }
    function closeModal() {
        legalModal.style.display = 'none';
    }
    termsLink.addEventListener('click', function(e) {
        e.preventDefault();
        openModal(termsContent);
    });
    privacyLink.addEventListener('click', function(e) {
        e.preventDefault();
        openModal(privacyContent);
    });
    legalModalClose.addEventListener('click', closeModal);
    window.addEventListener('click', function(e) {
        if (e.target === legalModal) closeModal();
    });
    </script>
</body>
<style>
/* Modal styles */
.legal-modal {
    display: none;
    position: fixed;
    z-index: 9999;
    left: 0;
    top: 0;
    width: 100vw;
    height: 100vh;
    overflow: auto;
    background: rgba(40,40,40,0.7);
    justify-content: center;
    align-items: center;
}
.legal-modal-content {
    background: #222;
    color: #f8f8f8;
    margin: 5vh auto;
    padding: 2rem;
    border-radius: 18px;
    max-width: 500px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    position: relative;
    max-height: 80vh;
    overflow-y: auto;
}
.legal-modal-close {
    position: absolute;
    top: 1rem;
    right: 1rem;
    background: none;
    border: none;
    color: #f8f8f8;
    font-size: 2rem;
    cursor: pointer;
}
.legal-links {
    text-align: center;
    margin-top: 1.5rem;
    font-size: 0.95rem;
}
.legal-links a {
    color: #ffb86b; /* yellowish accent */
    text-decoration: underline;
    margin: 0 1rem; /* increase gap between links */
    cursor: pointer;
}
.legal-links a:hover { color: #ffd59a; }
/* spacing for inline links inside checkbox labels */
.terms-wrapper .checkbox-label a {
    margin: 0 0.35rem;
    color: #ffb86b;
}

.legal-modal-content p {
    margin-bottom: 1.1rem;
}
.legal-modal-content {
    /* Firefox */
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.08) transparent;
}
/* WebKit browsers */
.legal-modal-content::-webkit-scrollbar {
    width: 10px;
}
.legal-modal-content::-webkit-scrollbar-track {
    background: transparent;
}
.legal-modal-content::-webkit-scrollbar-thumb {
    background-color: rgba(255,255,255,0.06);
    border-radius: 8px;
    border: 2px solid transparent; /* creates padding effect */
    background-clip: padding-box;
}
.legal-modal-content::-webkit-scrollbar-thumb:hover {
    background-color: rgba(255,255,255,0.10);
}
/* ensure mailto and any links inside modal use yellow accent */
.legal-modal-content a, .legal-modal-content a[href^="mailto:"] {
    color: #ffb86b;
    font-weight: 600;
}
</style>
</html>
