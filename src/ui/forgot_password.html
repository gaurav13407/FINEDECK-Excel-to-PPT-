<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Forgot password — FinDeck</title>
    <link href="assets/img/favicon.png" rel="icon">
    <link href="assets/css/mainpage.css" rel="stylesheet">
    <link href="assets/css/auth.css" rel="stylesheet">
    <style>
    .forgot-card { max-width:700px; margin:56px auto; padding:28px; background:var(--card-bg); color:var(--text-primary); border-radius:14px; box-shadow:0 12px 40px rgba(0,0,0,0.6); border:1px solid rgba(229,157,2,0.06); }
    .neu-button.yellow { background: var(--accent-color); color: var(--primary-bg); border: none; }
    /* Larger email input to better match the card and background */
    .code-input { font-size:1.15rem; padding:14px 18px; width:100%; max-width:560px; margin:12px auto; display:block; border-radius:12px; border:1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.06); color:var(--text-primary); }
    .code-input::placeholder { color: rgba(255,255,255,0.45); }
    /* Send button text should be black to match Cancel */
    #sendBtn { min-width:160px; color: #000 !important; }
    </style>
</head>
<body>
    <main class="main-content">
        <div class="container">
            <div class="forgot-card">
                <h2>Reset your password</h2>
                <p class="verify-sub">Enter the email for your account. We'll send a one-time code to that email to verify it's you.</p>

                <div style="max-width:540px;margin:18px auto;text-align:center">
                    <input id="emailInput" class="code-input" placeholder="you@company.com" type="email">
                    <div style="display:flex;gap:12px;justify-content:center;margin-top:12px">
                        <button id="sendBtn" class="neu-button primary">Send code</button>
                        <a href="login.html" class="neu-button yellow" style="display:inline-flex;align-items:center;justify-content:center;padding:10px 16px;text-decoration:none;">Cancel</a>
                    </div>
                    <div id="fpMessage" style="margin-top:12px;text-align:center;color:var(--text-secondary)"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="assets/js/api-config.js"></script>
    <script src="assets/js/api-service.js"></script>
    <script>
    (function(){
        const emailInput = document.getElementById('emailInput');
        const sendBtn = document.getElementById('sendBtn');
        const msg = document.getElementById('fpMessage');

        async function sendCode(){
            const email = emailInput.value.trim();
            if(!email){ msg.textContent = 'Please enter your email.'; return }
            sendBtn.disabled = true; msg.textContent = 'Sending...';
            try{
                const res = await fetch(`${window.apiConfig.API_BASE}/codes/send`, {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({email, purpose: 'password_reset'})
                });
                const j = await res.json();
                if(res.ok){
                    msg.textContent = 'Code sent — check your email.';
                    // redirect to reset page with email (so user can enter code & new password)
                    setTimeout(()=>{
                        const url = `reset_password.html?email=${encodeURIComponent(email)}`;
                        window.location.href = url;
                    }, 800);
                } else {
                    msg.textContent = j.detail || j.message || 'Failed to send code.';
                }
            }catch(err){
                console.error(err); msg.textContent = 'Network error while sending code.';
            } finally { sendBtn.disabled = false }
        }

        sendBtn.addEventListener('click', sendCode);
        emailInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') sendCode() });
    })();
    </script>
</body>
</html>
