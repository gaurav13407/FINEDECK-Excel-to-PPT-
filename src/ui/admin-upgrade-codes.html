<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinDeck - Admin: Generate Upgrade Codes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .plan-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .plan-option {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .plan-option:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .plan-option.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .plan-option h3 {
            margin-bottom: 10px;
        }

        .plan-option .price {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            border-radius: 10px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }

        .result.error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }

        .code-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
        }

        .code {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
            margin: 15px 0;
        }

        .copy-btn {
            padding: 10px 20px;
            width: auto;
            background: #667eea;
            margin-top: 10px;
        }

        .history {
            margin-top: 20px;
        }

        .history-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .history-item.redeemed {
            opacity: 0.6;
            border-left-color: #28a745;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            display: none;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 FinDeck Admin</h1>
            <p>Generate Plan Upgrade Codes</p>
        </div>

        <div class="card">
            <h2 style="margin-bottom: 30px;">Generate Upgrade Code</h2>

            <form id="upgradeForm">
                <div class="form-group">
                    <label for="customerEmail">Customer Email *</label>
                    <input 
                        type="email" 
                        id="customerEmail" 
                        name="customerEmail" 
                        placeholder="customer@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Select Plan *</label>
                    <div class="plan-selector">
                        <div class="plan-option" data-plan="BASIC">
                            <h3>📦 Basic</h3>
                            <div class="price">$25/mo</div>
                            <p>15 PPTs/month</p>
                        </div>
                        <div class="plan-option" data-plan="PRO">
                            <h3>⭐ Pro</h3>
                            <div class="price">$49/mo</div>
                            <p>50 PPTs/month</p>
                        </div>
                        <div class="plan-option" data-plan="AI_PRO">
                            <h3>🚀 AI Pro</h3>
                            <div class="price">$99/mo</div>
                            <p>200 PPTs/month</p>
                        </div>
                    </div>
                    <input type="hidden" id="selectedPlan" name="plan" required>
                </div>

                <div class="form-group">
                    <label for="durationMonths">Duration (months)</label>
                    <select id="durationMonths" name="durationMonths">
                        <option value="1">1 Month</option>
                        <option value="3">3 Months</option>
                        <option value="6">6 Months</option>
                        <option value="12">12 Months</option>
                        <option value="0">Lifetime</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="notes">Notes (optional)</label>
                    <textarea 
                        id="notes" 
                        name="notes" 
                        rows="3"
                        placeholder="Internal notes about this upgrade..."
                    ></textarea>
                </div>

                <button type="submit" id="generateBtn">
                    🎁 Generate Upgrade Code & Send Email
                </button>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 15px;">Generating code and sending email...</p>
            </div>

            <div class="result" id="result"></div>
        </div>

        <div class="card">
            <h2 style="margin-bottom: 20px;">📜 Recent Codes</h2>
            <div id="codeHistory"></div>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE = 'http://localhost:8000/api/v1';
        let selectedPlan = null;
        let adminToken = localStorage.getItem('authToken'); // Assuming admin is logged in

        // Plan selection
        document.querySelectorAll('.plan-option').forEach(option => {
            option.addEventListener('click', function() {
                // Remove previous selection
                document.querySelectorAll('.plan-option').forEach(opt => {
                    opt.classList.remove('selected');
                });
                
                // Add selection to clicked option
                this.classList.add('selected');
                selectedPlan = this.dataset.plan;
                document.getElementById('selectedPlan').value = selectedPlan;
            });
        });

        // Form submission
        document.getElementById('upgradeForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!selectedPlan) {
                showResult('Please select a plan', 'error');
                return;
            }

            const formData = {
                email: document.getElementById('customerEmail').value,
                plan: selectedPlan,
                duration_months: parseInt(document.getElementById('durationMonths').value) || 1,
                notes: document.getElementById('notes').value || null
            };

            document.getElementById('generateBtn').disabled = true;
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/upgrades/generate-upgrade-code`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${adminToken}`
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccessResult(data);
                    loadRecentCodes();
                    document.getElementById('upgradeForm').reset();
                    document.querySelectorAll('.plan-option').forEach(opt => {
                        opt.classList.remove('selected');
                    });
                    selectedPlan = null;
                } else {
                    showResult(data.detail || 'Failed to generate code', 'error');
                }
            } catch (error) {
                showResult('Network error: ' + error.message, 'error');
            } finally {
                document.getElementById('generateBtn').disabled = false;
                document.getElementById('loading').style.display = 'none';
            }
        });

        function showSuccessResult(data) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result success';
            resultDiv.style.display = 'block';
            
            const expiryDate = new Date(data.expires_at).toLocaleDateString();
            
            resultDiv.innerHTML = `
                <h3>✅ Success!</h3>
                <p>Upgrade code generated and emailed to <strong>${data.customer_email}</strong></p>
                
                <div class="code-box">
                    <div>Upgrade Code:</div>
                    <div class="code" id="generatedCode">${data.code}</div>
                    <button class="copy-btn" onclick="copyCode('${data.code}')">
                        📋 Copy Code
                    </button>
                    <div style="margin-top: 15px; font-size: 14px; color: #666;">
                        Expires: ${expiryDate}
                    </div>
                </div>
            `;
        }

        function showResult(message, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = `result ${type}`;
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `<h3>${type === 'success' ? '✅' : '❌'} ${message}</h3>`;
        }

        function copyCode(code) {
            navigator.clipboard.writeText(code).then(() => {
                alert('Code copied to clipboard!');
            });
        }

        async function loadRecentCodes() {
            try {
                const response = await fetch(`${API_BASE}/upgrades/admin/all-upgrade-codes?include_redeemed=true&include_expired=false`, {
                    headers: {
                        'Authorization': `Bearer ${adminToken}`
                    }
                });

                const data = await response.json();

                const historyDiv = document.getElementById('codeHistory');
                
                if (data.codes && data.codes.length > 0) {
                    historyDiv.innerHTML = data.codes.slice(0, 10).map(code => {
                        const generatedDate = new Date(code.generated_at).toLocaleDateString();
                        const expiryDate = new Date(code.expires_at).toLocaleDateString();
                        const redeemedClass = code.is_redeemed ? 'redeemed' : '';
                        
                        return `
                            <div class="history-item ${redeemedClass}">
                                <strong>${code.code}</strong> - ${code.plan}
                                <br>
                                <small>
                                    Customer: ${code.customer_email} | 
                                    Generated: ${generatedDate} | 
                                    Expires: ${expiryDate}
                                    ${code.is_redeemed ? ` | ✓ Redeemed by ${code.redeemed_by_email}` : ''}
                                </small>
                            </div>
                        `;
                    }).join('');
                } else {
                    historyDiv.innerHTML = '<p style="text-align: center; color: #999;">No codes generated yet</p>';
                }
            } catch (error) {
                console.error('Failed to load codes:', error);
            }
        }

        // Load recent codes on page load
        if (adminToken) {
            loadRecentCodes();
        } else {
            alert('Please login as admin first');
            window.location.href = '/login.html';
        }
    </script>
</body>
</html>
