<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Set a new password — FinDeck</title>
    <link href="assets/img/favicon.png" rel="icon">
    <link href="assets/css/mainpage.css" rel="stylesheet">
    <link href="assets/css/auth.css" rel="stylesheet">
    <!-- Include shared signup styles so auth pages use the same input/button styling -->
    <link href="assets/css/signup.css" rel="stylesheet">
    <style>
    .reset-card { max-width:720px; margin:56px auto; padding:28px; background:var(--card-bg); color:var(--text-primary); border-radius:14px; box-shadow:0 12px 40px rgba(0,0,0,0.6); border:1px solid rgba(229,157,2,0.06); }
    .form-row{max-width:520px;margin:0 auto; display:flex; flex-direction:column; align-items:center}
    /* Add breathing room between intro text and the form notice */
    .verify-sub { margin-bottom: 18px; }
    #emailNotice { margin-top: 8px; margin-bottom: 14px; }
    .neu-button.yellow { background: var(--accent-color); color: var(--primary-bg); border: none; }
    /* Larger, unified input styles to match the card */
    .code-input { font-size:1.15rem; padding:14px 18px; width:100%; max-width:420px; margin:8px auto; display:block; border-radius:12px; border:1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.06); color:var(--text-primary); }
    .code-input::placeholder { color: rgba(255,255,255,0.45); }
    /* Buttons row below inputs, responsive */
    .btn-row { display:flex; gap:12px; justify-content:center; margin-top:18px; }
    /* Make Reset button text black like Cancel */
    #resetBtn { color: #000 !important; }
    @media (max-width:560px){ .btn-row{flex-direction:column;align-items:stretch} .btn-row .neu-button{width:100%} }
    /* Center the inline field-row and label */
    .field-row{display:flex;align-items:center;justify-content:center;width:100%;max-width:420px;margin:8px auto}
    .field-label{width:88px;text-align:right;margin-right:12px;color:var(--text-secondary);font-weight:600}
    </style>
</head>
<body>
    <main class="main-content">
        <div class="container">
            <div class="reset-card">
                <h2>Create a new password</h2>
                <p class="verify-sub">Enter the code we sent to your email and choose a new password.</p>

                <div class="form-row">
                    <div id="emailNotice" style="text-align:center;margin-bottom:12px;color:var(--text-secondary);font-weight:600"></div>

                    <label for="codeInput" style="margin-top:12px">Code</label>
                    <input id="codeInput" class="code-input" maxlength="9" placeholder="XXXX-XXXX" autofocus>

                    <div class="form-group" style="width:100%;max-width:520px;">
                        <div class="input-group neu-input password-group">
                            <input id="newPass" class="code-input" type="password" placeholder=" " autocomplete="new-password">
                            <label for="newPass">New password</label>
                            <div class="input-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                    <path d="M7 11V7a5 5 0 0110 0v4"/>
                                </svg>
                            </div>
                            <button type="button" class="password-toggle neu-toggle" id="newPassToggle" aria-label="Toggle password visibility">
                                <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                        <span class="error-message" id="newPassError"></span>
                    </div>

                    <div class="form-group" style="width:100%;max-width:520px;">
                        <div class="input-group neu-input password-group">
                            <input id="confirmPass" class="code-input" type="password" placeholder=" " autocomplete="new-password">
                            <label for="confirmPass">Confirm new password</label>
                            <div class="input-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                    <path d="M7 11V7a5 5 0 0110 0v4"/>
                                </svg>
                            </div>
                            <button type="button" class="password-toggle neu-toggle" id="confirmPassToggle" aria-label="Toggle password visibility">
                                <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                        <span class="error-message" id="confirmPasswordError"></span>
                    </div>

                    <!-- spacer to keep layout consistent -->
                    <div style="width:100%;max-width:420px;margin-top:8px;display:flex;justify-content:center;align-items:center;gap:8px;">
                        <!-- placeholder to keep spacing consistent -->
                    </div>

                    <div class="btn-row">
                        <button id="resetBtn" class="neu-button primary">Reset password</button>
                        <a href="login.html" class="neu-button yellow" style="display:inline-flex;align-items:center;justify-content:center;padding:10px 16px;text-decoration:none;">Cancel</a>
                    </div>
                    <div id="rpMessage" style="margin-top:12px;text-align:center;color:var(--text-secondary)"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="assets/js/api-config.js"></script>
    <script src="assets/js/api-service.js"></script>
    <script>
    (function(){
        // Read email from query param if provided
        const params = new URLSearchParams(window.location.search);
        const email = params.get('email') || '';

        const codeInput = document.getElementById('codeInput');
        const newPass = document.getElementById('newPass');
        const confirmPass = document.getElementById('confirmPass');
        const resetBtn = document.getElementById('resetBtn');
        const msg = document.getElementById('rpMessage');

        function formatCodeInput(el){
            let v = el.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
            if(v.length>4) v = v.slice(0,4) + '-' + v.slice(4,8);
            el.value = v.slice(0,9);
        }
        codeInput.addEventListener('input', ()=>formatCodeInput(codeInput));

        async function doReset(){
            const code = codeInput.value.trim();
            const p1 = newPass.value;
            const p2 = confirmPass.value;
            if(!code || p1.length<6 || p1!==p2){
                msg.textContent = !code ? 'Enter code' : p1.length<6 ? 'Password must be at least 6 characters' : 'This is required';
                return;
            }
            resetBtn.disabled = true; msg.textContent = 'Submitting...';
            try{
                const body = { email, code, new_password: p1, confirm_password: p2 };
                const res = await fetch(`${window.apiConfig.API_BASE}/auth/reset-password`, {
                    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
                });
                const j = await res.json();
                if(res.ok){ msg.style.color=''; msg.textContent = j.message || 'Password reset'; setTimeout(()=>window.location.href='login.html',1200); }
                else{ msg.textContent = j.detail || j.message || 'Reset failed' }
            }catch(err){ console.error(err); msg.textContent = 'Network error' }
            finally{ resetBtn.disabled = false }
        }

        resetBtn.addEventListener('click', doReset);
        [codeInput,newPass,confirmPass].forEach(el=>el.addEventListener('keydown',(e)=>{ if(e.key==='Enter') doReset() }));

        // Eye buttons for toggling each password visibility (match signup pattern)
        function attachToggle(buttonId, inputEl){
            const btn = document.getElementById(buttonId);
            if(!btn) return;
            btn.addEventListener('click', ()=>{
                const type = inputEl.type === 'password' ? 'text' : 'password';
                inputEl.type = type;
                btn.classList.toggle('show-password', type === 'text');
                // toggle svg visibility if present
                const open = btn.querySelector('.eye-open');
                const closed = btn.querySelector('.eye-closed');
                if(open && closed){
                    if(type === 'text') { open.style.display = 'none'; closed.style.display = 'block'; }
                    else { open.style.display = ''; closed.style.display = 'none'; }
                }
            });
        }

        attachToggle('newPassToggle', newPass);
        attachToggle('confirmPassToggle', confirmPass);

        // Live validation: use signup-style error messages ("This is required") for mismatch/empty
        const confirmError = document.getElementById('confirmPasswordError');
        function checkMatch(){
            if(!newPass.value || !confirmPass.value){ confirmError.textContent = 'This is required'; return }
            if(newPass.value !== confirmPass.value){ confirmError.textContent = 'This is required'; }
            else { confirmError.textContent = ''; }
        }
        newPass.addEventListener('input', checkMatch);
        confirmPass.addEventListener('input', checkMatch);

        // Prefill centered email notice if present
        if(email){
            const notice = document.getElementById('emailNotice');
            notice.textContent = `Resetting password for ${email}`;
        }
    })();
    </script>
</body>
</html>
